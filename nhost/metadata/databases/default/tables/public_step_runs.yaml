table:
  name: step_runs
  schema: public
object_relationships:
  - name: workflow_run
    using:
      foreign_key_constraint_on: workflow_run_id
  - name: workflow_step
    using:
      foreign_key_constraint_on: workflow_step_id
  - name: approver
    using:
      foreign_key_constraint_on: approved_by
select_permissions:
  - role: owner
    permission:
      columns: '*'
      filter:
        workflow_run:
          workflow:
            organization:
              members:
                _and:
                  - user_id:
                      _eq: X-Hasura-User-Id
                  - role:
                      _eq: owner
  - role: editor
    permission:
      columns: '*'
      filter:
        workflow_run:
          workflow:
            organization:
              members:
                user_id:
                  _eq: X-Hasura-User-Id
  - role: viewer
    permission:
      columns: '*'
      filter:
        workflow_run:
          workflow:
            organization:
              members:
                user_id:
                  _eq: X-Hasura-User-Id
update_permissions:
  - role: owner
    permission:
      columns:
        - status
        - approved_by
        - approved_at
      filter:
        workflow_run:
          workflow:
            organization:
              members:
                _and:
                  - user_id:
                      _eq: X-Hasura-User-Id
                  - role:
                      _eq: owner
  - role: editor
    permission:
      columns:
        - status
        - approved_by
        - approved_at
      filter:
        workflow_run:
          workflow:
            organization:
              members:
                _and:
                  - user_id:
                      _eq: X-Hasura-User-Id
                  - role:
                      _in:
                        - owner
                        - editor
