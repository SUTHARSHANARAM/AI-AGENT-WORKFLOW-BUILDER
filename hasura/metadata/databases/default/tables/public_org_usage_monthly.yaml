table:
  name: org_usage_monthly
  schema: public
object_relationships:
  - name: organization
    using:
      manual_configuration:
        column_mapping:
          org_id: id
        remote_table:
          name: organizations
          schema: public
select_permissions:
  - role: owner
    permission:
      columns: '*'
      filter:
        organization:
          members:
            _and:
              - user_id:
                  _eq: X-Hasura-User-Id
              - role:
                  _eq: owner
  - role: editor
    permission:
      columns: '*'
      filter:
        organization:
          members:
            user_id:
              _eq: X-Hasura-User-Id
  - role: viewer
    permission:
      columns: '*'
      filter:
        organization:
          members:
            user_id:
              _eq: X-Hasura-User-Id
