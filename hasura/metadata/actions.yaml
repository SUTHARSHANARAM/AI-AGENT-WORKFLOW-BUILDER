actions:
  - name: triggerWorkflowRun
    definition:
      kind: synchronous
      handler: '{{ACTION_BASE_URL}}/api/actions/trigger-workflow-run'
      forward_client_headers: true
      headers:
        - name: Content-Type
          value: application/json
    permissions:
      - role: owner
      - role: editor
  - name: approveStep
    definition:
      kind: synchronous
      handler: '{{ACTION_BASE_URL}}/api/actions/approve-step'
      forward_client_headers: true
      headers:
        - name: Content-Type
          value: application/json
    permissions:
      - role: owner
      - role: editor
custom_types:
  enums: []
  input_objects: []
  objects:
    - name: TriggerWorkflowRunOutput
      fields:
        - name: workflow_run_id
          type: uuid!
        - name: status
          type: String!
    - name: ApproveStepOutput
      fields:
        - name: workflow_run_id
          type: uuid!
        - name: step_run_id
          type: uuid!
        - name: status
          type: String!
  scalars: []
